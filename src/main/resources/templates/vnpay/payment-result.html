<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kết quả giao dịch</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                    135deg,
                    #667eea 0%,
                    #764ba2 100%
            );
        }

        .card {
            background: #fff;
            padding: 50px 40px;
            border-radius: 24px;

            width: 90%;
            max-width: 500px;

            text-align: center;

            box-shadow:
                    0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .message {
            font-size: 24px;
            font-weight: 600;
            color: #1f2937;

            margin-bottom: 30px;
            line-height: 1.5;
        }

        .btn-back {
            display: inline-block;

            padding: 14px 28px;

            border-radius: 12px;

            text-decoration: none;
            color: white;

            background: linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
            );

            font-weight: 600;

            transition: all 0.3s ease;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.35);
        }
    </style>
</head>
<body>

<div class="card">

    <div class="icon">💳</div>

    <div
            class="message"
            th:text="${paymentResult}">
        Thanh toán thành công
    </div>

    <a
            th:href="${'http://localhost:2204/invoices/detail/' + invoice.id}"
            class="btn-back">
        Quay lại
    </a>

</div>

</body>
</html>
